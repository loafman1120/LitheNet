name: lithenet
description: Flutter desktop client for Lithe, prepared for the Rustbox core.
version: 0.2.0
publish_to: none

environment:
  sdk: ">=3.12.2 <4.0.0"
  flutter: ">=3.44.0"

dependencies:
  fixnum: ^1.1.1
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.3.2
  go_router: ^17.3.0
  grpc: ^5.1.0
  path_provider: ^2.1.6
  protobuf: ^6.0.0
  rustbox_flutter: ^0.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
